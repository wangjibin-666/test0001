<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 串口调试助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .controls {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-weight: 500;
            color: #495057;
            font-size: 14px;
        }

        .control-group select, .control-group input[type="number"] {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            min-width: 150px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.4);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel h2 {
            font-size: 18px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 5px;
        }

        .log-area {
            flex: 1;
            padding: 15px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            background: #f8f9fa;
            resize: vertical;
            min-height: 300px;
            overflow-y: auto;
        }

        .send-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .send-area textarea {
            flex: 1;
            padding: 15px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            min-height: 150px;
        }

        .send-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            color: #495057;
        }

        .status-bar {
            background: #e9ecef;
            padding: 15px;
            font-size: 14px;
            color: #495057;
            border-top: 1px solid #dee2e6;
        }

        .status-bar span {
            font-weight: 500;
            color: #007bff;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .control-group select, .control-group input[type="number"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 Web 串口调试助手</h1>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="port">串口</label>
                <select id="port">
                    <option value="">选择串口</option>
                </select>
            </div>

            <div class="control-group">
                <label for="baudRate">波特率</label>
                <select id="baudRate">
                    <option value="9600">9600</option>
                    <option value="19200">19200</option>
                    <option value="38400">38400</option>
                    <option value="57600">57600</option>
                    <option value="115200" selected>115200</option>
                    <option value="230400">230400</option>
                    <option value="460800">460800</option>
                    <option value="921600">921600</option>
                </select>
            </div>

            <div class="control-group">
                <label for="dataBits">数据位</label>
                <select id="dataBits">
                    <option value="8" selected>8</option>
                    <option value="7">7</option>
                    <option value="6">6</option>
                    <option value="5">5</option>
                </select>
            </div>

            <div class="control-group">
                <label for="stopBits">停止位</label>
                <select id="stopBits">
                    <option value="1" selected>1</option>
                    <option value="2">2</option>
                </select>
            </div>

            <div class="control-group">
                <label for="parity">校验位</label>
                <select id="parity">
                    <option value="none" selected>无</option>
                    <option value="even">偶校验</option>
                    <option value="odd">奇校验</option>
                </select>
            </div>

            <button id="connectBtn" class="btn btn-primary">打开串口</button>
            <button id="disconnectBtn" class="btn btn-danger" disabled>关闭串口</button>
            <button id="clearBtn" class="btn btn-success">清空日志</button>
        </div>

        <div class="main-content">
            <div class="panel">
                <h2>📥 接收日志</h2>
                <div id="receiveLog" class="log-area"></div>
            </div>

            <div class="panel">
                <h2>📤 发送数据</h2>
                <div class="send-area">
                    <textarea id="sendInput" placeholder="输入要发送的数据..."></textarea>
                    <div class="send-controls">
                        <button id="sendBtn" class="btn btn-primary" disabled>发送</button>
                        <div class="checkbox-group">
                            <input type="checkbox" id="newLine">
                            <label for="newLine">添加换行</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="hexMode">
                            <label for="hexMode">十六进制模式</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            状态: <span id="status">未连接</span>
        </div>
    </div>

    <script>
        let port;
        let reader;
        let inputDone;
        let outputDone;
        let outputStream;

        const portSelect = document.getElementById('port');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const receiveLog = document.getElementById('receiveLog');
        const sendInput = document.getElementById('sendInput');
        const newLineCheckbox = document.getElementById('newLine');
        const hexModeCheckbox = document.getElementById('hexMode');
        const statusSpan = document.getElementById('status');

        const baudRateSelect = document.getElementById('baudRate');
        const dataBitsSelect = document.getElementById('dataBits');
        const stopBitsSelect = document.getElementById('stopBits');
        const paritySelect = document.getElementById('parity');

        // 检查浏览器支持
        if (!('serial' in navigator)) {
            alert('您的浏览器不支持 Web Serial API，请使用 Chrome 89+ 或 Edge 89+');
            connectBtn.disabled = true;
        }

        // 连接串口
        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({
                    baudRate: parseInt(baudRateSelect.value),
                    dataBits: parseInt(dataBitsSelect.value),
                    stopBits: parseInt(stopBitsSelect.value),
                    parity: paritySelect.value
                });

                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                sendBtn.disabled = false;
                statusSpan.textContent = `已连接: ${port.getInfo().usbProductName || '未知设备'}`;

                // 监听接收数据
                const textDecoder = new TextDecoderStream();
                inputDone = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();

                readLoop();

                // 设置输出流
                const textEncoder = new TextEncoderStream();
                outputDone = textEncoder.readable.pipeTo(port.writable);
                outputStream = textEncoder.writable.getWriter();
            } catch (error) {
                console.error('连接失败:', error);
                statusSpan.textContent = `连接失败: ${error.message}`;
            }
        });

        // 断开连接
        disconnectBtn.addEventListener('click', async () => {
            if (reader) {
                await reader.cancel();
                await inputDone.catch(() => {});
                reader = null;
                inputDone = null;
            }

            if (outputStream) {
                await outputStream.close();
                await outputDone.catch(() => {});
                outputStream = null;
                outputDone = null;
            }

            await port.close();
            port = null;

            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            sendBtn.disabled = true;
            statusSpan.textContent = '已断开连接';
        });

        // 读取数据循环
        async function readLoop() {
            while (true) {
                const { value, done } = await reader.read();
                if (done) {
                    reader.releaseLock();
                    break;
                }
                
                if (hexModeCheckbox.checked) {
                    // 十六进制显示
                    const hex = Array.from(value).map(byte => byte.toString(16).padStart(2, '0')).join(' ');
                    appendToLog(hex + '\n', 'receive');
                } else {
                    // 文本显示
                    appendToLog(value, 'receive');
                }
            }
        }

        // 发送数据
        sendBtn.addEventListener('click', async () => {
            if (!port || !outputStream) return;

            let data = sendInput.value;
            if (newLineCheckbox.checked) {
                data += '\n';
            }

            try {
                if (hexModeCheckbox.checked) {
                    // 十六进制发送
                    const hexData = data.replace(/\s+/g, '');
                    const bytes = new Uint8Array(hexData.length / 2);
                    for (let i = 0; i < hexData.length; i += 2) {
                        bytes[i / 2] = parseInt(hexData.substr(i, 2), 16);
                    }
                    await outputStream.write(bytes);
                } else {
                    // 文本发送
                    await outputStream.write(new TextEncoder().encode(data));
                }
                
                appendToLog(`发送: ${data}`, 'send');
            } catch (error) {
                console.error('发送失败:', error);
                statusSpan.textContent = `发送失败: ${error.message}`;
            }
        });

        // 清空日志
        clearBtn.addEventListener('click', () => {
            receiveLog.textContent = '';
        });

        // 追加日志
        function appendToLog(text, type) {
            const div = document.createElement('div');
            div.style.marginBottom = '5px';
            div.style.padding = '5px 0';
            div.style.borderBottom = '1px solid #e9ecef';
            
            if (type === 'send') {
                div.style.color = '#dc3545';
            } else {
                div.style.color = '#007bff';
            }
            
            div.textContent = text;
            receiveLog.appendChild(div);
            receiveLog.scrollTop = receiveLog.scrollHeight;
        }

        // 回车发送
        sendInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });
    </script>
</body>
</html>
